name: apk

# 为什么在云端构建而不是本机：Chaquopy 要 JDK 17 + Android SDK + Gradle，
# 本机只有 JDK 8、没有 SDK。云端构建还能保证「改 Python 代码不用碰本地环境」。
#
# 只手动触发，不在 push 时自动跑：
#   成品包还在自测阶段，每次提交都自动出一个 APK 塞进 Actions，等于把没验证过
#   的半成品一直往 GitHub 上堆。要测的时候手动点一次，产物只留 3 天。
#   （仓库本身不放任何 .apk/.aab，.gitignore 已经挡住了。）
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Chaquopy 要求构建机的 Python 次版本与 APK 里嵌的版本完全一致，
      # 否则编译 .pyc 时会直接拒绝。runner 自带的 python3 是 3.14，
      # 而 build.gradle.kts 里钉的是 3.12，必须显式装一个 3.12 顶到 PATH 前面。
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 确认宿主 Python 版本
        run: python3 -V

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # 每次 runner 都是全新的，默认会生成一把新的 debug 签名 —— 于是新包和手机上
      # 已经装的那个签名对不上，只能先卸载再装，app 的私有数据（原始设置、体检结论）
      # 每装一次丢一次。把 keystore 缓存住，后面就能直接覆盖安装。
      - name: 复用同一把调试签名
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: 构建 debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: 汇总产物信息
        working-directory: android
        run: |
          ls -lh app/build/outputs/apk/debug/ || true

      - uses: actions/upload-artifact@v4
        with:
          name: mifi-autotune-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          # 自测阶段的产物，别在 GitHub 上长期堆积
          retention-days: 3
