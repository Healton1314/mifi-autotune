name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    # Windows runner 的默认控制台编码不是 UTF-8，脚本里一旦 print 中文就会
    # UnicodeEncodeError 直接失败（跟代码逻辑无关）。统一强制 UTF-8。
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    strategy:
      fail-fast: false
      matrix:
        # 显式列组合，而不是 os × python 全交叉。
        # 原因：ubuntu-latest 现在是 24.04，actions/setup-python 在上面装不出 3.8
        # （缺 libssl1.1），会在 setup 步骤就失败、6 秒退出，看起来像代码问题。
        # 3.8 只在 ubuntu-22.04 上跑，其余组合用较新的 Python。
        include:
          - { os: ubuntu-22.04,   python: "3.8" }
          - { os: ubuntu-latest,  python: "3.12" }
          - { os: windows-latest, python: "3.8" }
          - { os: windows-latest, python: "3.12" }
          - { os: macos-latest,   python: "3.12" }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # 防止 setup 静默回落到别的版本，导致「3.8 通过」其实根本没测 3.8。
      # 输出保持纯 ASCII：这一步要在三个系统的默认 shell 里跑，
      # 任何非 ASCII 字符都可能踩到编码问题。
      - name: 版本自检
        env:
          WANT_PY: ${{ matrix.python }}
        run: python -c "import os,sys; v=sys.version.split()[0]; w=os.environ['WANT_PY']; print('actual python', v, 'expected', w, 'stdout', sys.stdout.encoding); sys.exit(0 if v.startswith(w) else 1)"

      - name: 语法检查
        run: python -m compileall -q autotune.py server.py scanner.py probe.py drivers

      - name: 单元测试（纯逻辑，不碰设备）
        run: python -m unittest discover -s tests -v
